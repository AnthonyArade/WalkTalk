<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>WalkTalk overlay</title>
<link id="fonts" rel="stylesheet" href="/fonts.css">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  /* The canvas is the Browser Source's area; the box inside it carries the background, border and padding. */
  #canvas {
    position: absolute; left: 0; top: 0; box-sizing: border-box;
    /* padding: room kept for the avatar when the box moves aside for it */
    display: flex; flex-direction: column; overflow: hidden; transform-origin: 0 0;
  }
  #box {
    box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden;
    max-width: 100%; max-height: 100%;
    transition-property: opacity, transform; transition-timing-function: ease;
  }
  #box.empty { opacity: 0; }
  /* The avatar: placed anywhere on the canvas, over the box. Its two pictures take turns while talking. */
  #avatar { position: absolute; display: none; pointer-events: none; z-index: 2; transition-property: opacity; transition-timing-function: ease; }
  #avatar img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain;
                opacity: 0; }
  /* How the box leaves when it is cleared */
  #box.leave-fade { opacity: 0; }
  #box.leave-slide-up { opacity: 0; transform: translateY(-40%); }
  #box.leave-slide-down { opacity: 0; transform: translateY(40%); }
  #box.leave-shrink { opacity: 0; transform: scale(0.85); }
  .line { white-space: pre-wrap; overflow-wrap: break-word; paint-order: stroke fill; }
  .line.leaving { opacity: 0; transition: opacity 0.25s ease; }
  /* Revealed pieces (characters or words): hidden ones keep their place, so lines wrap the same from the start */
  .bit { display: inline; white-space: pre-wrap; }
  .bit.wait { visibility: hidden; }
  .bit.fade.on { animation: wt-fade var(--reveal) ease-out both; }
  /* Pop and rise move each piece, which needs inline-block from the start (so nothing re-wraps as they appear), and
     letters kept together in their word (so a line never breaks between two letters). */
  .bit.pop, .bit.rise { display: inline-block; }
  .word, .word > .bit { white-space: nowrap; }
  .bit.pop.on { animation: wt-pop var(--reveal) cubic-bezier(.2,1.6,.4,1) both; }
  .bit.rise.on { animation: wt-rise var(--reveal) ease-out both; }
  @keyframes wt-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes wt-pop { from { opacity: 0; transform: scale(0.3); } to { opacity: 1; transform: scale(1); } }
  @keyframes wt-rise { from { opacity: 0; transform: translateY(0.35em); } to { opacity: 1; transform: translateY(0); } }
  /* Preview inside WalkTalk: a checkerboard shows what is transparent, and the canvas is scaled to fit. */
  body.preview { background: repeating-conic-gradient(#3a3a3a 0 25%, #2c2c2c 0 50%) 0 0 / 24px 24px; }
  body.preview #canvas { outline: 1px dashed rgba(255,255,255,0.35); }
</style>
</head>
<body>
<div id="canvas"><div id="box" class="empty"></div><div id="avatar"><img id="avatarBase" alt=""><img id="avatarActive" alt=""></div></div>
<script>
  const id = location.pathname.split('/').filter(Boolean).pop();
  const preview = new URLSearchParams(location.search).has('preview');
  // Sample sentences for the preview while nothing has been said: long enough to show how lines wrap at the
  // edge of the box. Each is a sentence of its own, as real ones are.
  const samples = [
    'Welcome to the stream! This is how your transcript will look in OBS.',
    'Every sentence appears here as soon as you say it, and long ones wrap onto the next line.',
    'Hello chat!', 'Thanks for watching.', 'See you next time.', 'Bye!'
  ];
  const canvas = document.getElementById('canvas');
  const box = document.getElementById('box');
  const place = { top: 'flex-start', middle: 'center', bottom: 'flex-end', left: 'flex-start', center: 'center', right: 'flex-end' };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  let style = null, hideTimer = null, showingSamples = false;
  const queue = [];        // sentences waiting their turn
  let working = false;     // a sentence is being revealed
  if (preview) document.body.classList.add('preview');

  // ---------- sounds ----------
  // Built-in sounds are made here with the Web Audio API: nothing to download. A chosen file is fetched once.
  // In the preview, sounds play only for "Play" tests and demos, so WalkTalk doesn't echo what OBS already plays.
  let audio = null;
  const buffers = {};
  let soundsAllowed = !preview, lastTyping = 0;
  function ctx() { return audio ??= new (window.AudioContext || window.webkitAudioContext)(); }

  function tone(a, t, type, from, to, length, peak) {
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(from, t);
    if (to !== from) o.frequency.exponentialRampToValueAtTime(to, t + length);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + length);
    o.connect(g); return { node: o, gain: g, length };
  }
  function noise(a, t, length, peak, filter, f1, f2) {
    const b = a.createBuffer(1, Math.ceil(a.sampleRate * length), a.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = a.createBufferSource(); s.buffer = b;
    const f = a.createBiquadFilter(); f.type = filter; f.frequency.setValueAtTime(f1, t);
    if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + length);
    const g = a.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + Math.min(0.01, length / 3)); g.gain.exponentialRampToValueAtTime(0.0001, t + length);
    s.connect(f); f.connect(g); return { node: s, gain: g, length };
  }
  const builtIn = {
    click: (a, t) => [noise(a, t, 0.025, 0.7, 'highpass', 2500)],
    tick: (a, t) => [tone(a, t, 'square', 1800, 1800, 0.02, 0.25)],
    typewriter: (a, t) => [noise(a, t, 0.04, 0.9, 'bandpass', 1800), tone(a, t, 'triangle', 220, 120, 0.05, 0.3)],
    bubble: (a, t) => [tone(a, t, 'sine', 500 + Math.random() * 300, 900, 0.06, 0.4)],
    pop: (a, t) => [tone(a, t, 'sine', 900, 250, 0.12, 0.7)],
    chime: (a, t) => [tone(a, t, 'sine', 1046, 1046, 0.5, 0.35), tone(a, t + 0.08, 'sine', 1568, 1568, 0.6, 0.25)],
    ding: (a, t) => [tone(a, t, 'triangle', 1318, 1318, 0.7, 0.4)],
    'whoosh-in': (a, t) => [noise(a, t, 0.35, 0.5, 'bandpass', 300, 2500)],
    'whoosh-out': (a, t) => [noise(a, t, 0.35, 0.5, 'bandpass', 2500, 300)],
    swoosh: (a, t) => [noise(a, t, 0.22, 0.6, 'highpass', 800, 5000)],
  };

  async function loadFile(url) {
    if (!url || buffers[url]) return;
    try {
      const data = await (await fetch(url)).arrayBuffer();
      buffers[url] = await ctx().decodeAudioData(data);
    } catch { buffers[url] = null; }
  }

  function play(slot, force) {
    const s = style && style.sounds && style.sounds[slot];
    if (!s || !s.kind || s.volume <= 0 || (!soundsAllowed && !force)) return;
    if (slot === 'typing') {            // no machine-gun clicks: at most one every 25 ms
      const now = performance.now();
      if (now - lastTyping < 25) return;
      lastTyping = now;
    }
    const a = ctx();
    if (a.state === 'suspended') a.resume();
    const out = a.createGain(); out.gain.value = s.volume; out.connect(a.destination);
    const t = a.currentTime + 0.005;
    if (s.kind === 'file') {
      const b = buffers[s.url];
      if (!b) { loadFile(s.url); return; }
      const src = a.createBufferSource(); src.buffer = b; src.connect(out); src.start(t);
      return;
    }
    const make = builtIn[s.kind];
    if (!make) return;
    for (const part of make(a, t)) { part.gain.connect(out); part.node.start(t); part.node.stop(t + part.length + 0.05); }
  }

  // ---------- layout ----------
  function applyStyle() {
    if (!style || style.width === undefined) return;
    Object.assign(canvas.style, {
      width: style.width + 'px', height: style.height + 'px', padding: style.canvasPadding || '0',
      justifyContent: place[style.verticalAlign],   // where the box sits vertically
      alignItems: style.autoWidth ? place[style.textAlign] : 'stretch',
    });
    Object.assign(box.style, {
      width: style.autoWidth ? 'fit-content' : '100%',
      height: style.autoHeight ? 'auto' : '100%',
      justifyContent: place[style.verticalAlign],   // where the text sits inside a full-height box
      padding: style.padding, background: style.background,
      // border-image after border: the border shorthand resets it.
      border: style.border, borderImage: style.borderImage || 'none', imageRendering: style.imageRendering || 'auto',
      borderRadius: style.borderRadius + 'px',
      fontFamily: style.fontFamily, fontSize: style.fontSize + 'px', fontWeight: style.fontWeight,
      color: style.color, textTransform: style.textTransform, textAlign: style.textAlign,
      lineHeight: style.lineHeight, textShadow: style.textShadow,
      // The outline is drawn under the letters (paint-order), so only its outer half shows: double it.
      webkitTextStroke: style.outlineWidth > 0 ? (style.outlineWidth * 2) + 'px ' + style.outlineColor : '0',
      transitionDuration: (style.clearDuration || 0) + 'ms',
    });
    box.style.setProperty('--reveal', Math.max(80, Math.min(400, (style.characterInterval || 35) * 6)) + 'ms');
    for (const s of Object.values(style.sounds || {})) if (s.kind === 'file') loadFile(s.url);
    applyAvatar();
    fit();
    if (showingSamples || (preview && !box.children.length)) showSamples();
  }

  // ---------- avatar ----------
  // The base picture, until a sentence comes: then the base and active pictures take turns (a mouth opening and
  // closing), one every "transition" ms, while it is written. Like the box, the avatar clears "clearDelay" seconds
  // after the last sentence (fading over "clearDuration" ms) and comes back with the next; with no delay it stays.
  const avatar = document.getElementById('avatar');
  const avatarBase = document.getElementById('avatarBase'), avatarActive = document.getElementById('avatarActive');
  let talking = false, flapTimer = null, mouthOpen = false;
  let avatarShown = false, avatarClearTimer = null;

  function revealAvatar() {
    clearTimeout(avatarClearTimer);
    avatarShown = true;
    avatar.style.transitionDuration = '0ms';   // it comes back at once
    avatar.style.opacity = 1;
  }

  function clearAvatar() {
    const a = style && style.avatar;
    clearTimeout(avatarClearTimer);
    if (!a || !a.clearDelay) return;            // no delay: it stays
    avatarShown = false;
    avatar.style.transitionDuration = (a.clearDuration || 0) + 'ms';
    avatar.style.opacity = 0;
  }

  function clearAvatarLater() {
    const a = style && style.avatar;
    clearTimeout(avatarClearTimer);
    if (a && a.clearDelay && !(preview && showingSamples)) avatarClearTimer = setTimeout(clearAvatar, a.clearDelay * 1000);
  }

  function setPicture(img, url) {
    if (!url) { img.removeAttribute('src'); img.style.display = 'none'; return; }
    if (img.getAttribute('src') !== url) img.src = url;
    img.style.display = 'block';
  }

  function applyAvatar() {
    const a = style.avatar;
    if (!a || !a.on) { avatar.style.display = 'none'; return; }
    Object.assign(avatar.style, { display: 'block', left: a.x + 'px', top: a.y + 'px', width: a.width + 'px', height: a.height + 'px' });
    setPicture(avatarBase, a.baseUrl);
    setPicture(avatarActive, a.activeUrl);
    if (talking) startFlapping(); // a new rhythm applies at once
    if (!a.clearDelay) avatarShown = true;
    avatar.style.transitionDuration = '0ms';
    avatar.style.opacity = avatarShown ? 1 : 0;
    showAvatar();
  }

  function showAvatar() {
    const a = style && style.avatar;
    if (!a || !a.on) return;
    const active = talking && mouthOpen && !!a.activeUrl;   // without an active picture, the base one simply stays
    avatarBase.style.opacity = active ? 0 : a.baseOpacity;
    avatarActive.style.opacity = active ? a.activeOpacity : 0;
  }

  // The two pictures swap at once, in turn, every "transition" ms, starting with the active one.
  function startFlapping() {
    clearInterval(flapTimer);
    mouthOpen = true;
    const every = Math.max(30, (style && style.avatar && style.avatar.transition) || 150);
    flapTimer = setInterval(() => { mouthOpen = !mouthOpen; showAvatar(); }, every);
  }

  function talk() {
    revealAvatar();
    if (!talking) { talking = true; startFlapping(); }
    showAvatar();
  }
  // The writing is done: the base picture stays, until the avatar clears.
  function stopTalking() {
    talking = false; mouthOpen = false; clearInterval(flapTimer); showAvatar();
    clearAvatarLater();
  }

  // In the preview the canvas shrinks to fit the window; in OBS it is drawn at its real size.
  function fit() {
    if (!preview || !style) { canvas.style.transform = ''; return; }
    const scale = Math.min(1, (innerWidth - 16) / style.width, (innerHeight - 16) / style.height);
    const left = (innerWidth - style.width * scale) / 2, top = (innerHeight - style.height * scale) / 2;
    canvas.style.transform = `translate(${left}px, ${top}px) scale(${scale})`;
  }

  function line(text) { const div = document.createElement('div'); div.className = 'line'; div.textContent = text; return div; }

  // Older sentences that no longer fit in the box go, whole: otherwise the top one would show cut in half.
  function trimOverflow() {
    while (box.children.length > 1 && box.scrollHeight > box.clientHeight + 1) box.firstElementChild.remove();
  }

  // The preview, while nothing has been said: the samples, shown at once.
  function showSamples() {
    if (queue.length || working) return;
    showingSamples = true;
    clearing++;              // a clear still fading out mustn't empty the samples
    revealAvatar();
    box.className = '';
    box.replaceChildren(...samples.slice(0, style ? style.lines : 2).map(line));
    trimOverflow();
  }

  // ---------- showing sentences ----------
  function receive(text) {
    queue.push(text);
    if (!working) run();
  }

  async function run() {
    working = true;
    clearTimeout(hideTimer);
    talk();
    while (queue.length) {
      const text = queue.shift();
      if (showingSamples) { showingSamples = false; box.replaceChildren(); box.className = 'empty'; }
      // The box was fading out: finish that at once, so the end of the fade doesn't empty the new sentence.
      if (box.className.startsWith('leave')) { clearing++; box.replaceChildren(); box.className = 'empty'; }
      const wasEmpty = box.classList.contains('empty') || !box.children.length;
      if (style.replacePrevious && !wasEmpty) await clearBox(false);
      // Too many sentences: the oldest fades out first.
      const keep = style.replacePrevious ? 1 : style.lines;
      while (box.children.length >= keep) {
        const old = box.firstElementChild;
        if (style.animate) { old.classList.add('leaving'); await sleep(250); }
        old.remove();
      }
      const div = document.createElement('div');
      div.className = 'line';
      box.appendChild(div);
      if (box.classList.contains('empty') || box.className.startsWith('leave')) {
        box.className = '';
        play('show');
      }
      play('sentence');
      if (style.animate) await reveal(div, text);
      else { div.textContent = text; trimOverflow(); }
      if (queue.length && style.animate) await sleep(style.sentenceInterval);
    }
    working = false;
    stopTalking();
    hideLater();
  }

  // Reveals a sentence a character or a word at a time. Every piece is laid out first (hidden), so the lines
  // wrap where they will end up and nothing jumps while it types.
  async function reveal(div, text) {
    const effect = style.revealEffect;
    const spans = [];
    function bit(parent, piece) {
      const s = document.createElement('span');
      // Spaces take no part in the effect: they stay ordinary text where lines can break.
      s.className = 'bit wait' + (effect === 'appear' || !piece.trim() ? '' : ' ' + effect);
      s.textContent = piece;
      parent.appendChild(s);
      spans.push(s);
    }
    for (const token of text.split(/(\s+)/).filter(p => p.length)) {
      if (style.revealUnit === 'word' || !token.trim()) { bit(div, token); continue; }
      const word = document.createElement('span');
      word.className = 'word';
      div.appendChild(word);
      for (const letter of Array.from(token)) bit(word, letter);
    }
    trimOverflow(); // every piece is laid out (hidden) by now, so the room it needs is known
    for (let i = 0; i < spans.length; i++) {
      const s = spans[i], blank = !s.textContent.trim();
      s.classList.remove('wait'); s.classList.add('on');
      if (blank) continue;                     // spaces take no time
      play('typing');
      const endOfWord = style.revealUnit === 'word' || (i + 1 < spans.length && !spans[i + 1].textContent.trim());
      await sleep(style.characterInterval + (endOfWord ? style.wordPause : 0));
    }
  }

  // Empties the box with the clear animation.
  // A newer sentence (or the preview's samples) can take over while it fades: then the box isn't emptied.
  let clearing = 0;
  async function clearBox(toEmpty) {
    const kind = style.clearAnimation;
    const mine = ++clearing;
    play('hide');
    if (kind !== 'none' && style.clearDuration > 0) {
      box.className = 'leave-' + kind;
      await sleep(style.clearDuration);
      if (mine !== clearing) return;
    }
    box.replaceChildren();
    box.className = toEmpty ? 'empty' : '';
  }

  function hideLater() {
    clearTimeout(hideTimer);
    if (!style || !style.hideAfter || (preview && showingSamples)) return;
    hideTimer = setTimeout(async () => {
      if (working || !box.children.length) return;
      await clearBox(true);
      if (preview) setTimeout(() => { if (!working && !box.children.length) showSamples(); }, 1500);
    }, style.hideAfter * 1000);
  }

  // ---------- from WalkTalk ----------
  // The preview's "Play" buttons: a demo of the animation (with its sounds), or one sound.
  window.walktalkDemo = () => { soundsAllowed = true; queue.length = 0; samples.slice(0, Math.max(1, style.lines)).forEach(receive); };
  window.walktalkPlay = slot => { play(slot, true); };

  const events = new EventSource('/events?c=' + encodeURIComponent(id));
  events.addEventListener('style', e => { style = JSON.parse(e.data); applyStyle(); });
  events.addEventListener('line', e => receive(JSON.parse(e.data).text));
  events.addEventListener('clear', () => { queue.length = 0; clearBox(true); clearAvatar(); });
  events.addEventListener('fonts', () => { document.getElementById('fonts').href = '/fonts.css?' + Date.now(); });
  addEventListener('resize', fit);
</script>
</body>
</html>
